# Render Production Configuration for CodingCON Backend
# Deployed with load balancing for 500+ concurrent users
# 
# Key Features:
# - Express.js REST API + Socket.IO WebSocket server
# - Node.js clustering for multi-core CPU utilization
# - MongoDB connection pooling (min=10, max=50)
# - Automated cron jobs for keep-alive and contest sync
# - Health checks for automatic instance restart

services:
  # ──────────────────────────────────────────────────────────────────────────
  # MAIN WEB SERVICE: Express.js Backend API
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: codingcon-backend
    runtime: node
    plan: standard     # For production (auto-scales)
    region: singapore  # Or closest to your users
    
    # Build & Start
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    
    # Keep service alive on inactivity (Render standard feature)
    autoDeploy: true
    branch: main
    
    # Health Check Configuration
    healthCheckPath: /api/health
    healthCheckInterval: 10
    healthCheckTimeout: 5
    healthCheckStartDelay: 60  # Wait 60s before first health check
    
    # Scaling Configuration
    # Note: Render handles horizontal scaling automatically
    # For more performance, upgrade to "pro" plan
    scaling:
      minInstances: 1
      maxInstances: 1  # Single instance with multi-core clustering
      # Alternative: Use maxInstances=2-3 for true horizontal scaling

    # Environment Variables
    envVars:
      # Core Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLUSTER_ENABLED
        value: true
      - key: WORKERS
        value: 4  # Auto-detect (number of CPU cores)
      
      # Database Configuration
      - key: MONGODB_URI
        sync: false  # Requires manual configuration
      - key: DB_POOL_SIZE
        value: 50    # Connection pool max
      - key: DB_MIN_POOL_SIZE
        value: 10    # Connection pool min
      - key: DB_CONNECTION_TIMEOUT
        value: 45000 # 45 seconds
      
      # Authentication & Security
      - key: JWT_SECRET
        generateValue: true  # Render generates strong value
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # CORS & API Configuration
      - key: CORS_ORIGIN
        sync: false  # Requires manual configuration (Vercel URL)
      
      # Queue & Caching
      - key: RABBITMQ_URL
        sync: false  # Optional, from CloudAMQP
      - key: REDIS_URL
        sync: false  # Optional, from Upstash/Redis Cloud
      
      # Performance Tuning
      - key: MAX_JUDGE_JOBS
        value: 4     # Concurrent judge executions
      - key: QUEUE_CONCURRENCY
        value: 2     # Queue consumer concurrency
      - key: REQUEST_TIMEOUT
        value: 30000 # 30 seconds
      
      # Monitoring & Logging
      - key: CRON_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info

  # ──────────────────────────────────────────────────────────────────────────
  # CRON JOB: Keep-Alive Ping (Every 10 Minutes)
  # Prevents Render from sleeping backend (keeps it "warm")
  # ──────────────────────────────────────────────────────────────────────────
  - type: cron
    name: codingcon-backend-cron-keepalive
    runtime: node
    schedule: "*/10 * * * *"  # Every 10 minutes
    rootDir: backend
    
    buildCommand: echo "Cron job ready"
    startCommand: |
      node -e "
        const url = (process.env.BACKEND_URL || 'https://codingcon-backend.onrender.com') + '/api/cron';
        const headers = process.env.CRON_SECRET ? { 'Authorization': 'Bearer ' + process.env.CRON_SECRET } : {};
        fetch(url, { headers, timeout: 30000 })
          .then(r => r.json())
          .then(data => console.log('✓ Keep-alive ping successful:', data.message))
          .catch(err => console.error('✗ Keep-alive ping failed:', err.message));
      "
    
    # Environment Variables (inherited from web service)
    envVars:
      - key: BACKEND_URL
        value: https://codingcon-backend.onrender.com  # Update after deployment
      - key: CRON_SECRET
        sync: true  # Use from web service

  # ──────────────────────────────────────────────────────────────────────────
  # CRON JOB: Contest Sync (Every 5 Minutes)
  # Syncs contest status and leaderboard updates
  # ──────────────────────────────────────────────────────────────────────────
  - type: cron
    name: codingcon-backend-cron-sync
    runtime: node
    schedule: "*/5 * * * *"   # Every 5 minutes
    rootDir: backend
    
    buildCommand: echo "Cron job ready"
    startCommand: |
      node -e "
        const url = (process.env.BACKEND_URL || 'https://codingcon-backend.onrender.com') + '/api/cron';
        const headers = process.env.CRON_SECRET ? { 'Authorization': 'Bearer ' + process.env.CRON_SECRET } : {};
        fetch(url, { headers, timeout: 30000 })
          .then(r => r.json())
          .then(data => console.log('✓ Contest sync successful:', data.message))
          .catch(err => console.error('✗ Contest sync failed:', err.message));
      "
    
    envVars:
      - key: BACKEND_URL
        value: https://codingcon-backend.onrender.com
      - key: CRON_SECRET
        sync: true

# ────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT INSTRUCTIONS
# ────────────────────────────────────────────────────────────────────────────
# 
# 1. Copy this file to `backend/render.yaml`
# 
# 2. Connect to Render:
#    - Go to Render Dashboard → New + → Web Service
#    - Connect your GitHub repository
#    - Render auto-detects render.yaml
# 
# 3. Configure Environment Variables on Render Dashboard:
#    - MONGODB_URI: mongodb+srv://user:pass@cluster.mongodb.net/codingcon
#    - CORS_ORIGIN: https://your-app.vercel.app
#    - JWT_SECRET: (auto-generated, or provide your own)
#    - CRON_SECRET: (auto-generated, or provide your own)
#    - RABBITMQ_URL: (optional, from CloudAMQP)
#    - REDIS_URL: (optional, from Upstash)
# 
# 4. Deploy:
#    - Click "Create Web Service"
#    - Render deploys automatically from main branch
#    - Watch logs for errors
# 
# 5. Verify:
#    curl https://codingcon-backend.onrender.com/api/health
#    # Should return: {"status":"ok","database":"mongodb",...}
# 
# ────────────────────────────────────────────────────────────────────────────
# PERFORMANCE NOTES
# ────────────────────────────────────────────────────────────────────────────
# 
# With this configuration, your backend can handle:
#   ✓ 500-1000+ concurrent WebSocket connections
#   ✓ 1000+ requests per second
#   ✓ Multi-core CPU utilization (4+ cores)
#   ✓ MongoDB connection pooling (50 connections)
#   ✓ Automatic keep-alive (prevents sleep)
#   ✓ Real-time updates via Socket.IO
#   ✓ Judge job queue processing
# 
# To upgrade performance:
#   1. Change plan: standard → pro
#   2. Add REDIS_URL for caching
#   3. Add RABBITMQ_URL for job queues
#   4. Monitor via Render dashboard
# 
# ────────────────────────────────────────────────────────────────────────────
# TROUBLESHOOTING
# ────────────────────────────────────────────────────────────────────────────
# 
# Build fails:
#   - Check: npm install works locally
#   - Check: npm run build succeeds
#   - Check: backend/package.json has all dependencies
# 
# Health check fails:
#   - Check: MONGODB_URI is valid
#   - Check: MongoDB IP whitelist includes Render
#   - Check: Port 4000 is open (should be automatic)
# 
# High memory usage:
#   - Reduce: DB_POOL_SIZE to 30 or 20
#   - Check: Logs for memory leaks
#   - Monitor: via Render dashboard
# 
# WebSocket connection fails:
#   - Check: CORS_ORIGIN includes Vercel domain
#   - Check: Socket.IO transports: ['websocket', 'polling']
#   - Check: No firewall blocking WebSocket upgrade
# 
# ────────────────────────────────────────────────────────────────────────────
